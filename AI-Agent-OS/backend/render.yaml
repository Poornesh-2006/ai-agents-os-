services:
  - type: web
    name: ai-agent-os-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd dashboard/backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: MODEL
        value: moonshotai/kimi-k2.6